name: Micro Frontend CI Pipeline

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Stage 1: Lint & Typecheck
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ────────────────────────────────────────────────────────────
  # Stage 2: Unit Tests
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # ────────────────────────────────────────────────────────────
  # Stage 3: Component Tests
  # ────────────────────────────────────────────────────────────
  component-tests:
    name: Component Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Component Tests
        run: npm run test:component

  # ────────────────────────────────────────────────────────────
  # Stage 3b: Contract Tests (parallel with Component Tests)
  # ────────────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Contract Tests
        run: npm run test:contract

      - name: Upload Pact Files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pact-contracts
          path: pacts/

  # ────────────────────────────────────────────────────────────
  # Stage 3c: Accessibility Tests (parallel with Component/Contract Tests)
  #
  # Runs axe-core against all top-level pages and shared components via
  # Vitest + jsdom. Any accessibility violation fails this job and blocks
  # the downstream `build` and `e2e-tests` jobs, breaking the pipeline.
  # ────────────────────────────────────────────────────────────
  a11y-tests:
    name: Accessibility Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Accessibility Tests
        run: npm run test:a11y

  # ────────────────────────────────────────────────────────────
  # Stage 3d: Code Coverage (parallel with other test stages)
  #
  # Runs the full Vitest suite with --coverage. Vitest enforces the 95%
  # thresholds configured in `vitest.config.ts` (statements, branches,
  # functions, lines); falling below any threshold fails this job and
  # therefore the pipeline.
  # ────────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage (>= 95%)
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-full
          path: coverage/
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Stage 4: Build Verification
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: [component-tests, contract-tests, a11y-tests, coverage]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # ────────────────────────────────────────────────────────────
  # Stage 5: Security Penetration Testing
  # ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Penetration Test
    needs: build
    runs-on: ubuntu-latest

    # product-service and order-service are Spring Boot + JPA apps with
    # `ddl-auto: update` and a PostgreSQL dialect, so they require a reachable
    # database at startup. Without one they fail to build the
    # EntityManagerFactory, never bind their port, and the pentest ends up
    # scanning nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout micro-frontend
        uses: actions/checkout@v5
        with:
          path: micro-frontend

      - name: Checkout product-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout order-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/order-service
          path: order-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout security-pentest
        uses: actions/checkout@v5
        with:
          repository: boschtech/security-pentest
          path: security-pentest
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            product-service/pom.xml
            order-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            micro-frontend/package-lock.json
            security-pentest/package-lock.json

      - name: Build services and frontend
        run: |
          mvn -f product-service/pom.xml package -DskipTests -B -q
          mvn -f order-service/pom.xml package -DskipTests -B -q
          (cd micro-frontend && npm ci && VITE_PRODUCT_SERVICE_URL=http://localhost:8080 VITE_ORDER_SERVICE_URL=http://localhost:8081 npm run build)

      # Each service owns its own schema, mirroring production.
      - name: Create service databases
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          for db in product_db order_db; do
            psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" \
              | grep -q 1 || psql -d postgres -c "CREATE DATABASE $db"
          done

      # NOTE: product-service and order-service need *different* DATABASE_URLs,
      # so the stack is started in separate steps rather than one shared `env:`
      # block. Do NOT set RATE_LIMIT_RPM here: the pentest's rate-limit scan
      # fires a 120-request burst and raises a finding unless it sees a 429,
      # so this job must run against the default limit of 100/min.
      - name: Start product-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ORDER_SERVICE_URL: http://localhost:8081
          DATABASE_URL: jdbc:postgresql://localhost:5432/product_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: |
          nohup java -jar product-service/target/*.jar > /tmp/product.log 2>&1 &

      - name: Start order-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          PRODUCT_SERVICE_URL: http://localhost:8080
          DATABASE_URL: jdbc:postgresql://localhost:5432/order_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: |
          nohup java -jar order-service/target/*.jar > /tmp/order.log 2>&1 &

      - name: Serve micro-frontend
        run: |
          nohup npx --yes serve -s micro-frontend/dist -l 3000 > /tmp/frontend.log 2>&1 &

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            local url=$1
            local log=$2
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✅ $url is up"
                return 0
              fi
              sleep 2
            done
            echo "❌ Timed out waiting for $url"
            # Surface why the process never became healthy instead of failing blind.
            if [ -n "$log" ] && [ -f "$log" ]; then
              echo "::group::$log (last 100 lines)"
              tail -n 100 "$log"
              echo "::endgroup::"
            fi
            return 1
          }
          wait_for http://localhost:8080/actuator/health /tmp/product.log
          wait_for http://localhost:8081/actuator/health /tmp/order.log
          wait_for http://localhost:3000 /tmp/frontend.log

      - name: Install pentest dependencies
        working-directory: security-pentest
        run: npm ci

      - name: Run Security Scan
        working-directory: security-pentest
        env:
          PRODUCT_SERVICE_URL: http://localhost:8080
          ORDER_SERVICE_URL: http://localhost:8081
          FRONTEND_URL: http://localhost:3000
          PENTEST_API_KEY: ${{ secrets.API_KEY || 'changeme-dev-only' }}
        run: npm run scan

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-pentest-report
          path: security-pentest/reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Stage 6: E2E Tests (all) against a locally deployed stack
  # (product-service + order-service + micro-frontend) running
  # on the GitHub Actions runner.
  # ────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (all)
    needs: build
    runs-on: ubuntu-latest

    # product-service and order-service are Spring Boot + JPA apps with
    # `ddl-auto: update` and a PostgreSQL dialect, so they require a reachable
    # database at startup. Without one they fail to build the
    # EntityManagerFactory, never bind their port, and the health check below
    # times out.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout micro-frontend
        uses: actions/checkout@v5
        with:
          path: micro-frontend

      - name: Checkout product-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/product-service
          path: product-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout order-service
        uses: actions/checkout@v5
        with:
          repository: boschtech/order-service
          path: order-service
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Checkout ui-playwright-automation
        uses: actions/checkout@v5
        with:
          repository: boschtech/ui-playwright-automation
          path: ui-playwright-automation
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            product-service/pom.xml
            order-service/pom.xml

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            micro-frontend/package-lock.json
            ui-playwright-automation/package-lock.json

      - name: Build product-service JAR
        working-directory: product-service
        run: mvn package -DskipTests -B

      - name: Build order-service JAR
        working-directory: order-service
        run: mvn package -DskipTests -B

      - name: Install micro-frontend deps
        working-directory: micro-frontend
        run: npm ci

      - name: Build micro-frontend
        working-directory: micro-frontend
        env:
          VITE_PRODUCT_SERVICE_URL: http://localhost:8080
          VITE_ORDER_SERVICE_URL: http://localhost:8081
        run: npm run build

      # Each service owns its own schema, mirroring production.
      - name: Create service databases
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          for db in product_db order_db; do
            psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" \
              | grep -q 1 || psql -d postgres -c "CREATE DATABASE $db"
          done

      # All Playwright workers share the runner's single outbound IP, so the
      # default 100 req/min per-IP bucket in RateLimitFilter is exhausted by the
      # suite itself and surfaces as 429s / "Failed to load products" flakes.
      - name: Start product-service
        working-directory: product-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          ORDER_SERVICE_URL: http://localhost:8081
          DATABASE_URL: jdbc:postgresql://localhost:5432/product_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          RATE_LIMIT_RPM: '100000'
        run: |
          nohup java -jar target/*.jar > product-service.log 2>&1 &
          echo $! > /tmp/product-service.pid

      - name: Start order-service
        working-directory: order-service
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          PRODUCT_SERVICE_URL: http://localhost:8080
          DATABASE_URL: jdbc:postgresql://localhost:5432/order_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          RATE_LIMIT_RPM: '100000'
        run: |
          nohup java -jar target/*.jar > order-service.log 2>&1 &
          echo $! > /tmp/order-service.pid

      - name: Serve micro-frontend
        working-directory: micro-frontend
        run: |
          nohup npx --yes serve -s dist -l 3000 > micro-frontend.log 2>&1 &
          echo $! > /tmp/micro-frontend.pid

      - name: Wait for services to be healthy
        run: |
          wait_for() {
            local url=$1
            local log=$2
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✅ $url is up"
                return 0
              fi
              sleep 2
            done
            echo "❌ Timed out waiting for $url"
            # Surface why the process never became healthy instead of failing blind.
            if [ -n "$log" ] && [ -f "$log" ]; then
              echo "::group::$log (last 100 lines)"
              tail -n 100 "$log"
              echo "::endgroup::"
            fi
            return 1
          }
          wait_for http://localhost:8080/actuator/health product-service/product-service.log
          wait_for http://localhost:8081/actuator/health order-service/order-service.log
          wait_for http://localhost:3000 micro-frontend/micro-frontend.log

      # ── AI: Restore cross-run history and contracts from cache ──
      - name: Restore AI history/contracts cache
        uses: actions/cache@v5
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-data-${{ github.ref_name }}-
            ai-data-main-

      - name: Install Playwright deps
        if: always()  # ensure packages are installed even if a prior step fails
        working-directory: ui-playwright-automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui-playwright-automation
        run: npx playwright install --with-deps

      # ── AI: Smart regression selection (optional) ──
      - name: AI - Smart Regression Selection
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          GREP_ARGS=$(npx tsx ai/scripts/select-regression.ts --output-args 2>/dev/null || true)
          echo "AI_GREP_ARGS=$GREP_ARGS" >> $GITHUB_ENV
          echo "Regression selection: $GREP_ARGS"

      - name: Run All E2E Tests
        working-directory: ui-playwright-automation
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test ${{ env.AI_GREP_ARGS }}

      # ── AI: Post-test analysis pipeline ──
      - name: AI - Failure RCA
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/analyze-failures.ts || true

      - name: AI - Flaky Test Detection
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/detect-flaky.ts || true

      - name: AI - Auto-Create Defects
        if: failure() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx ai/scripts/create-defects.ts || true

      - name: AI - Validate API Contracts
        if: always() && env.ANTHROPIC_API_KEY != ''
        working-directory: ui-playwright-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx ai/scripts/validate-contracts.ts || true

      - name: Clear API captures for next run
        if: always()
        working-directory: ui-playwright-automation
        run: rm -f ai/history/api-captures.json || true

      - name: Save AI history/contracts cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ui-playwright-automation/ai/history
            ui-playwright-automation/ai/contracts
          key: ai-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload AI Analysis Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-analysis-reports
          path: |
            ui-playwright-automation/ai/history/
            ui-playwright-automation/ai/contracts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ui-playwright-automation/playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: ui-playwright-automation/test-results/
          retention-days: 14

      - name: Upload Service Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: service-logs
          path: |
            product-service/product-service.log
            order-service/order-service.log
            micro-frontend/micro-frontend.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          for pidfile in /tmp/product-service.pid /tmp/order-service.pid /tmp/micro-frontend.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

